<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessSkins — Gallery</title>
<style>
  :root {
    --paper: #F2E7CE; --sheet: #FFF6E0; --card: #FFFFFF;
    --ink: #33261A; --muted: #8a7a5e;
    --sun: #FFC94D; --pop: #FF6F61; --go: #58A63C; --err: #C0392B;
    --sq-l: #f0d9b5; --sq-d: #b58863;
    --boing: cubic-bezier(.34,1.8,.5,1);
    --settle: cubic-bezier(.22,1.2,.36,1);
    --snap: cubic-bezier(.7,0,.3,1);
    --t-press: 90ms; --t-react: 160ms; --t-peel: 240ms; --t-enter: 520ms;
  }
  * { box-sizing: border-box; }
  body { margin: 0;
         font: 15px/1.45 ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
               Quicksand, system-ui, sans-serif;
         background: var(--paper); color: var(--ink); }
  button, input, select, textarea { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }

  header { display: flex; align-items: center; justify-content: space-between;
           flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  /* brand sticker: a tilted sun tile wearing the app icon */
  .brand-sticker { flex: none; width: 36px; height: 36px;
                   display: flex; align-items: center; justify-content: center;
                   background: var(--sun); border: 2.5px solid var(--ink); border-radius: 10px;
                   box-shadow: 2.5px 2.5px 0 var(--ink); transform: rotate(-4deg); }
  .brand-sticker img { width: 27px; height: 27px; display: block; }
  h1 { font-size: 26px; margin: 0; font-weight: 800; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin: 18px 0 22px; flex-wrap: wrap; }
  #chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 2px solid var(--ink); background: var(--card); color: var(--ink);
          border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 700;
          cursor: pointer; text-decoration: none; font-family: inherit; display: inline-block;
          transition: transform var(--t-press) var(--snap),
                      box-shadow var(--t-press) var(--snap); }
  .chip:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--ink); }
  .chip.active { background: var(--pop); color: #fff; box-shadow: 2px 2px 0 var(--ink);
                 animation: jelly 300ms var(--boing); }
  .chip.active:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
  .chip:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  /* category dropdown: chip-styled trigger + Sticker Club popover listbox */
  .dd { position: relative; display: inline-block; }
  #catSel { border: 2px solid var(--ink); background: var(--card); color: var(--ink);
            border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700;
            font-family: inherit; cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            transition: transform var(--t-press) var(--snap),
                        box-shadow var(--t-press) var(--snap); }
  #catSel::after { content: "\25BE"; font-size: 11px; line-height: 1; }
  #catSel:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--ink); }
  #catSel:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  #catSel[aria-expanded="true"] { background: var(--sheet); box-shadow: 2px 2px 0 var(--ink); }
  .dd-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
             min-width: 170px; max-height: 320px; overflow-y: auto;
             background: var(--card); border: 2.5px solid var(--ink); border-radius: 12px;
             box-shadow: 3px 3px 0 var(--ink); padding: 5px;
             animation: ddpop var(--t-react) var(--settle); }
  .dd-menu[hidden] { display: none; }
  .dd-menu .opt { padding: 6px 12px 6px 26px; border-radius: 8px; position: relative;
                  font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .dd-menu .opt:hover, .dd-menu .opt.active-opt { background: var(--sun); }
  .dd-menu .opt[aria-selected="true"]::before { content: "\2713"; position: absolute;
                                                left: 10px; font-weight: 900; }
  @keyframes ddpop {
    from { transform: scale(.92) translateY(-4px); }
    to   { transform: scale(1) translateY(0); }
  }
  .btn-create { margin-left: auto; border: 2.5px solid var(--ink); border-radius: 12px;
                padding: 9px 18px; font-size: 15px; font-weight: 800; font-family: inherit;
                cursor: pointer; background: var(--sun); color: var(--ink);
                text-decoration: none; box-shadow: 3px 3px 0 var(--ink);
                transition: transform var(--t-press) var(--snap),
                            box-shadow var(--t-press) var(--snap); }
  .btn-create:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn-create:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  #search { border: 2px solid var(--ink); border-radius: 10px; padding: 7px 12px;
            font-size: 14px; font-family: inherit; background: var(--card);
            color: var(--ink); width: 210px; }
  #search::placeholder { color: var(--muted); }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 2.5px solid var(--ink); border-radius: 14px;
          padding: 12px; cursor: pointer; position: relative;
          transition: transform var(--t-react) var(--settle),
                      box-shadow var(--t-react) var(--settle),
                      background var(--t-react) var(--snap); }
  .card:hover { transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--ink); }
  .card.selected { background: var(--sun); box-shadow: 3px 3px 0 var(--ink);
                   transform: rotate(-1.2deg); }
  .card.selected:hover { transform: translate(-2px,-2px) rotate(-1.2deg);
                         box-shadow: 4px 4px 0 var(--ink); }
  /* peel + stamp play only on a real click (JS adds .just-picked briefly) —
     never on initial render, re-renders or storage echoes */
  #grid .card.just-picked { animation: peel var(--t-peel) var(--boing); }
  #grid .card.just-picked .applied { animation: stamp 220ms var(--boing) 90ms backwards; }
  .star { position: absolute; top: -2px; right: -2px; z-index: 1; font-size: 24px; line-height: 1;
          color: #d8cbb0; cursor: pointer; user-select: none; padding: 4px; }
  .star:hover { transform: scale(1.2); }
  .star.faved { color: var(--pop); }
  /* pop only fires while the card is under the pointer (i.e. on real star
     clicks), so search/filter re-renders don't jelly every faved star */
  .card:hover .star.faved { animation: jelly 300ms var(--boing); }
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-radius: 8px;
           overflow: hidden; aspect-ratio: 5 / 2; }
  .board .sq { position: relative; aspect-ratio: 1; }
  .board .sq.l { background: var(--sq-l); } .board .sq.d { background: var(--sq-d); }
  .board img { position: absolute; inset: 4%; width: 92%; height: 92%; }
  /* the whole set wags once on hover */
  .card:hover .board img {
    animation: wiggle 440ms ease-in-out; transform-origin: 50% 88%; }
  .meta { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
  .meta .name { font-weight: 800; font-size: 15px; min-width: 0;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .cat { color: var(--muted); font-size: 11.5px; text-transform: uppercase;
               letter-spacing: .5px; flex: none; margin-left: 8px; }
  .meta .cat.yours { color: #fff; background: var(--go); border: 2px solid var(--ink);
                     border-radius: 999px; padding: 2px 8px; font-size: 10px;
                     font-weight: 900; letter-spacing: .5px; }
  .tag { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .card.selected .tag { color: var(--ink); }
  .applied { display: none; color: #fff; background: var(--go); border: 2px solid var(--ink);
             border-radius: 999px; padding: 3px 10px; font-weight: 900; font-size: 11px;
             text-transform: uppercase; letter-spacing: .5px; margin-top: 8px;
             width: max-content; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; }
  .card.selected .applied { display: block; }

  /* the two section eyebrows (BOARD / PIECES) share one look and one rhythm:
     12px label, 12px gap to content, 22px of air above each section */
  .eyebrow { font-size: 12px; margin: 0 0 12px; color: var(--muted);
             text-transform: uppercase; letter-spacing: .8px; font-weight: 800; }
  /* board strip: sticky bar of compact tiles above the skin grid.
     z-index keeps skin-card stars/hover-lifts painting underneath it;
     background matches the page so cards scroll under it cleanly. */
  #boards { position: sticky; top: 0; z-index: 5; background: var(--paper);
            border-bottom: 2px solid var(--ink); padding: 12px 0 14px; }
  #piecesHead { margin: 22px 0 12px; }
  .hscroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
             scroll-snap-type: x proximity; }
  .hscroll::-webkit-scrollbar { display: none; }
  #boardGrid { display: grid; grid-template-rows: 1fr; grid-auto-flow: column;
               grid-auto-columns: 140px; gap: 10px; padding: 4px; }
  .bcard { background: var(--card); border: 2.5px solid var(--ink); border-radius: 10px;
           padding: 5px 6px 6px; text-align: center; cursor: pointer;
           scroll-snap-align: start;
           transition: transform var(--t-react) var(--settle),
                       box-shadow var(--t-react) var(--settle),
                       background var(--t-react) var(--snap); }
  .bcard:hover { transform: translate(-2px,-2px); box-shadow: 3px 3px 0 var(--ink); }
  .bcard.selected { background: var(--sun); box-shadow: 3px 3px 0 var(--ink);
                    transform: rotate(-1.2deg); }
  .bcard.selected:hover { transform: translate(-2px,-2px) rotate(-1.2deg); }
  #boardGrid .bcard.just-picked { animation: peel var(--t-peel) var(--boing); }
  /* 2x3 whole-square crop of the 8x8 board art, anchored at a8: width shows
     3 of 8 columns (100% * 8/3) and the 3/2 aspect yields exactly 2 rows */
  .bcard .bpreview { aspect-ratio: 3 / 2; border-radius: 6px; overflow: hidden;
                     background-size: calc(100% * 8 / 3) auto; background-position: top left; }
  /* Site Default: lichess / chess.com palettes split along the tile diagonal,
     checker squares on the same 3-per-row grid as the board previews
     (selector must outweigh .bcard .bpreview's background-size) */
  .bcard .bpreview.bdefault { position: relative;
              background: repeating-conic-gradient(#b58863 0% 25%, #f0d9b5 0% 50%)
                          0 0 / calc(100% * 2 / 3) 100%; }
  .bdefault::after { content: ""; position: absolute; inset: 0;
                     background: repeating-conic-gradient(#779556 0% 25%, #ebecd0 0% 50%)
                                 0 0 / calc(100% * 2 / 3) 100%;
                     clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .bcard .bname { font-weight: 700; font-size: 12px; margin-top: 5px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard .btag { color: var(--muted); font-size: 10.5px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard.selected .btag { color: var(--ink); }

  footer { margin-top: 44px; text-align: center; color: var(--muted); font-size: 12.5px; }
  footer a { color: inherit; }

  /* the six moves — entrance plays once, scoped to body.entering (gallery.js
     removes the class after ~900ms so re-renders never replay the slap) */
  body.entering #grid .card, body.entering #boardGrid .bcard {
    animation: slap 420ms var(--settle) backwards;
    animation-delay: calc(var(--i, 0) * 40ms);
  }
  @keyframes slap {
    0%   { transform: scale(1.25) rotate(-4deg); opacity: 0; }
    55%  { transform: scale(.97) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes peel {
    0%   { transform: scale(1) rotate(0); }
    55%  { transform: scale(1.07) rotate(-2.6deg); }
    100% { transform: scale(1) rotate(-1.2deg); }
  }
  @keyframes stamp {
    from { transform: scale(0) rotate(10deg); }
    to   { transform: scale(1) rotate(0); }
  }
  @keyframes jelly {
    0%   { transform: scale(1); }
    35%  { transform: scaleX(1.22) scaleY(.84); }
    70%  { transform: scaleX(.92) scaleY(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes wiggle {
    0%   { transform: rotate(0); }
    25%  { transform: rotate(-6deg); }
    55%  { transform: rotate(4.5deg); }
    80%  { transform: rotate(-2deg); }
    100% { transform: rotate(0); }
  }
  @media (max-width: 640px) {
    .btn-create { margin-left: 0; }
    #search { flex: 1 1 100%; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body class="entering">
<div class="wrap">
  <header>
    <div class="brand">
      <span class="brand-sticker"><img src="icons/icon128.png" alt=""></span>
      <h1>ChessSkins Gallery</h1>
    </div>
    <a class="chip" href="https://github.com/NikAgs/ChessSkins" target="_blank">GitHub ↗</a>
  </header>

  <div class="toolbar">
    <span id="chips">
      <button class="chip active" data-filter="recent" data-i18n="filterRecent">Recent</button>
      <button class="chip" data-filter="favorites" data-i18n="filterFavorites">Favorites</button>
      <button class="chip" data-filter="name" data-i18n="filterName">Name (A-Z)</button>
      <span class="dd" id="catWrap">
        <button id="catSel" aria-haspopup="listbox" aria-expanded="false" aria-controls="catMenu"></button>
        <div class="dd-menu" id="catMenu" role="listbox" hidden></div>
      </span>
    </span>
    <a class="btn-create" href="create.html" data-i18n="createTitle">Create your own skin</a>
    <input id="search" type="text" data-i18n-placeholder="searchPh" placeholder="Search skins...">
  </div>

  <section id="boards">
    <h2 class="eyebrow" data-i18n="popupBoards">Board</h2>
    <div id="boardGrid" class="hscroll"></div>
  </section>

  <h2 class="eyebrow" id="piecesHead" data-i18n="popupSkins">Pieces</h2>
  <div id="grid"></div>

  <footer>
    <span data-i18n="madeWithLove">Made with ❤️ for chess nerds</span> ·
    <a href="https://buymeacoffee.com/nikags" target="_blank" data-i18n="btnCoffee">Buy me a coffee</a>
  </footer>
</div>
<script src="i18n.js"></script>
<script src="gallery.js"></script>
</body>
</html>
