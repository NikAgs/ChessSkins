<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ChessSkins — Gallery</title>
<style>
  :root {
    --bg: #f6efe3; --ink: #3d3833; --muted: #8a7f6d;
    --card: #fffaf1; --edge: #e3d8c4; --sel: #629924; --sel-soft: #e8f1dc;
    --sq-l: #f0d9b5; --sq-d: #b58863;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }

  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 26px; margin: 0; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 10px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin: 16px 0 22px; flex-wrap: wrap; }
  #chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--edge); background: var(--card); color: var(--muted);
          border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer;
          text-decoration: none; font-family: inherit; }
  .chip.active { background: var(--sel); border-color: var(--sel); color: #fff; }
  .btn-create { margin-left: auto; border: none; border-radius: 11px; padding: 10px 18px;
                font: 700 15px system-ui; cursor: pointer; background: var(--sel); color: #fff;
                text-decoration: none; box-shadow: 0 2px 6px rgba(98, 153, 36, .35);
                transition: transform .1s, box-shadow .1s; }
  .btn-create:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(98, 153, 36, .4); }
  #search { border: 1px solid var(--edge); border-radius: 9px; padding: 7px 12px;
            font: 14px system-ui; background: var(--card); color: var(--ink); width: 200px; }

  .columns { display: grid; grid-template-columns: 3fr 2fr; gap: 28px; align-items: start; }
  @media (max-width: 900px) { .columns { grid-template-columns: 1fr; } }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; padding: 12px;
          cursor: pointer; transition: border-color .1s, transform .1s; position: relative; }
  .star { position: absolute; top: 7px; right: 9px; z-index: 1; font-size: 17px; line-height: 1;
          color: #c9bda9; cursor: pointer; user-select: none; text-shadow: 0 1px 2px rgba(0,0,0,.25);
          padding: 4px; }
  .star:hover { transform: scale(1.2); }
  .star.faved { color: #f2b01e; }
  .card:hover { border-color: #c9bda9; transform: translateY(-2px); }
  .card.selected { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel-soft); }
  .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-radius: 8px;
           overflow: hidden; aspect-ratio: 5 / 2; }
  .board .sq { position: relative; aspect-ratio: 1; }
  .board .sq.l { background: var(--sq-l); } .board .sq.d { background: var(--sq-d); }
  .board img { position: absolute; inset: 4%; width: 92%; height: 92%; }
  .meta { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
  .meta .name { font-weight: 700; font-size: 15px; }
  .meta .cat { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; }
  .meta .cat.yours { color: var(--sel); font-weight: 700; }
  .tag { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .applied { display: none; color: var(--sel); font-weight: 700; font-size: 12px; margin-top: 6px; }
  .card.selected .applied { display: block; }

  #boards h2 { font-size: 21px; margin: 0 0 4px; }
  #boards .sub { color: var(--muted); margin-bottom: 14px; }
  #boardGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 12px; }
  .bcard { background: var(--card); border: 2px solid var(--edge); border-radius: 14px; padding: 8px;
           cursor: pointer; transition: border-color .1s, transform .1s; text-align: center; }
  .bcard:hover { border-color: #c9bda9; transform: translateY(-2px); }
  .bcard.selected { border-color: var(--sel); box-shadow: 0 0 0 2px var(--sel-soft); }
  .bcard .bpreview { aspect-ratio: 2 / 1; border-radius: 8px; background-size: 200%;
                     background-position: top left; overflow: hidden; }
  .bcard .name { font-weight: 700; font-size: 13px; margin-top: 7px; }
  .bcard .tag { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ChessSkins Gallery <small data-i18n="gallerySub">The chess board doesn't have to be boring</small></h1>
    <a class="chip" href="https://github.com/NikAgs/ChessSkins" target="_blank">🐙 GitHub ↗</a>
  </header>

  <div class="toolbar">
    <span id="chips">
      <button class="chip" data-filter="recent" data-i18n="filterRecent">🕒 Recent</button>
      <button class="chip active" data-filter="trending" data-i18n="filterTrending">🔥 Trending</button>
      <button class="chip" data-filter="popular" data-i18n="filterPopular">⭐ Most popular</button>
      <button class="chip" data-filter="name" data-i18n="filterName">🔤 Name (A-Z)</button>
    </span>
    <a class="btn-create" href="create.html" data-i18n="createTitle">✨ Create your own skin</a>
    <input id="search" type="text" data-i18n-placeholder="searchPh" placeholder="Search skins…">
  </div>

  <div class="columns">
    <div id="grid"></div>

    <section id="boards">
      <h2 data-i18n="boardsTitle">🟫 Board themes</h2>
      <div class="sub" data-i18n="boardsSub">Pick the ground your armies fight on — works with every skin.</div>
      <div id="boardGrid"></div>
    </section>
  </div>
</div>
<script src="i18n.js"></script>
<script src="gallery.js"></script>
</body>
</html>
