<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6efe3; --ink: #3d3833; --muted: #8a7f6d;
    --card: #fffaf1; --edge: #e3d8c4; --sel: #629924;
    --sq-l: #f0d9b5; --sq-d: #b58863;
  }
  body { width: 360px; max-height: 580px; margin: 0; overflow-y: auto;
         font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
           padding: 12px 14px 8px; border-bottom: 1px solid var(--edge); }
  .headrow { display: flex; align-items: center; justify-content: space-between; }
  header b { font-size: 17px; }
  header .sub { color: var(--muted); font-size: 12px; }

  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; border-radius: 24px; background: #c9bda9;
            transition: .15s; cursor: pointer; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px;
                   border-radius: 50%; background: #fff; left: 3px; top: 3px; transition: .15s; }
  input:checked + .slider { background: var(--sel); }
  input:checked + .slider:before { transform: translateX(20px); }

  .sites { display: flex; gap: 14px; padding-top: 7px; color: var(--muted); font-size: 12px; }
  .sites label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .sites input { accent-color: var(--sel); margin: 0; }
  #chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--edge); background: var(--card); color: var(--muted);
          border-radius: 20px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--sel); border-color: var(--sel); color: #fff; }

  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px 10px; }
  .card { background: var(--card); border: 2px solid var(--edge); border-radius: 12px;
          padding: 8px 8px 7px; cursor: pointer; text-align: center; transition: border-color .1s; }
  .card:hover { border-color: #c9bda9; }
  .card.selected { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
  .duo { display: flex; justify-content: center; }
  .duo .sq { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .duo .sq:first-child { background: var(--sq-l); border-radius: 8px 0 0 8px; }
  .duo .sq:last-child  { background: var(--sq-d); border-radius: 0 8px 8px 0; }
  .duo img { width: 50px; height: 50px; }
  .strip { display: none; justify-content: center; }
  .strip .sq { width: 24px; height: 62px; display: flex; align-items: center; justify-content: center; }
  .strip .sq:nth-child(odd) { background: var(--sq-l); }
  .strip .sq:nth-child(even) { background: var(--sq-d); }
  .strip .sq:first-child { border-radius: 8px 0 0 8px; }
  .strip .sq:last-child { border-radius: 0 8px 8px 0; }
  .strip img { width: 22px; height: 22px; }
  .card:hover .duo { display: none; }
  .card:hover .strip { display: flex; }
  .card .name { font-weight: 600; font-size: 13px; margin-top: 6px; }
  .card .tag { color: var(--muted); font-size: 11px; line-height: 1.25; margin-top: 1px;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 10px; color: var(--sel); font-weight: 700; letter-spacing: .4px; }

  footer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--edge);
           display: flex; gap: 8px; padding: 10px 14px; }
  footer button { flex: 1; border: 1px solid var(--edge); background: var(--card); color: var(--ink);
                  border-radius: 9px; padding: 7px 0; font: 600 12.5px system-ui; cursor: pointer; }
  footer button:hover { border-color: #c9bda9; }
  .disabled-note { padding: 8px 14px 0; color: var(--muted); font-size: 12px; display: none; }
  body.off #grid, body.off #chips { opacity: .45; pointer-events: none; }
  body.off .disabled-note { display: block; }
</style>
</head>
<body>
  <header>
    <div class="headrow">
      <div><b>ChessSkins</b><div class="sub" data-i18n="popupSub">Piece skins for lichess &amp; chess.com</div></div>
      <label class="switch"><input type="checkbox" id="master"><span class="slider"></span></label>
    </div>
    <div class="sites" id="sites">
      <label><input type="checkbox" id="siteLichess"> lichess.org</label>
      <label><input type="checkbox" id="siteChess"> chess.com</label>
    </div>
    <div id="chips"></div>
  </header>
  <div class="disabled-note" data-i18n="popupOff">Skins are off — sites show their own pieces. Flip the switch to bring the fun back.</div>
  <div id="grid"></div>
  <footer>
    <button id="openGallery" data-i18n="btnGallery">🖼️ Full gallery</button>
    <button id="openCreate" data-i18n="btnCreate">✨ Create your own</button>
  </footer>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
