name: PR check
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build must pass (validates every skin & board)
        run: python3 tools/build.py --no-zip
      - name: JS syntax check
        run: |
          for f in extension/*.js; do node --check "$f"; done
