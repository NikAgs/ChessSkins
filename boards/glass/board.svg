<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="glassL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f7fc"/>
      <stop offset="0.55" stop-color="#e0edf6"/>
      <stop offset="1" stop-color="#cfe0ed"/>
    </linearGradient>
    <linearGradient id="glassD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82a0ba"/>
      <stop offset="0.55" stop-color="#6d8ca6"/>
      <stop offset="1" stop-color="#57738f"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.72" stop-color="#1c3a52" stop-opacity="0"/>
      <stop offset="1" stop-color="#1c3a52" stop-opacity="0.10"/>
    </linearGradient>
    <g id="sqL">
      <rect width="100" height="100" fill="url(#glassL)"/>
      <rect width="100" height="100" fill="url(#sheenL)"/>
      <polygon points="58,0 76,0 0,76 0,58" fill="#ffffff" opacity="0.20"/>
      <polygon points="84,0 90,0 0,90 0,84" fill="#ffffff" opacity="0.14"/>
      <rect width="100" height="100" fill="url(#bevel)"/>
      <rect x="0.75" y="0.75" width="98.5" height="98.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
    </g>
    <g id="sqD">
      <rect width="100" height="100" fill="url(#glassD)"/>
      <rect width="100" height="100" fill="url(#sheenD)"/>
      <polygon points="58,0 76,0 0,76 0,58" fill="#ffffff" opacity="0.10"/>
      <polygon points="84,0 90,0 0,90 0,84" fill="#ffffff" opacity="0.07"/>
      <rect width="100" height="100" fill="url(#bevel)"/>
      <rect x="0.75" y="0.75" width="98.5" height="98.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    </g>
    <pattern id="tile" width="200" height="200" patternUnits="userSpaceOnUse">
      <use href="#sqL"/>
      <use href="#sqD" x="100"/>
      <use href="#sqD" y="100"/>
      <use href="#sqL" x="100" y="100"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#tile)"/>
</svg>
